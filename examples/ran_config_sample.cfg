!
! Synthetic RAN configuration sample - GSM/UMTS/LTE multi-technology site
! ALL values are invented placeholders for portfolio demonstration.
! Structure mirrors industry-standard MML-style configuration practice.
!
! ---------------------------------------------------------------------------
! Node identity
! ---------------------------------------------------------------------------
SET SUBRACK: SUBRACK=1, CABTYPE="generic-bbu";
SET NE: NAME="site-demo-001", LOCATION="zone-A";

! ---------------------------------------------------------------------------
! Transport / IP
! ---------------------------------------------------------------------------
ADD IPINTERFACE: IFIDX=1, IPADDR="10.100.0.11", MASK="255.255.255.0", VLAN=100;
ADD OAMROUTE: DSTIP="10.100.0.0", MASK="255.255.255.0", NEXTHOP="10.100.0.1";

! ---------------------------------------------------------------------------
! GSM (2G)
! ---------------------------------------------------------------------------
ADD BTS: BTSID=101, NAME="GSM-DEMO-A", BAND=GSM900;
ADD CELL: BTSID=101, CELLID=1, ARFCN=41, BSIC=10, PWR=43;

! ---------------------------------------------------------------------------
! UMTS (3G)
! ---------------------------------------------------------------------------
ADD NODEB: NODEBID=201, NAME="UMTS-DEMO-A";
ADD UCELL: NODEBID=201, UCELLID=1, UARFCN=10713, PSC=110, PWR=33;

! ---------------------------------------------------------------------------
! LTE (4G)
! ---------------------------------------------------------------------------
ADD ENB: ENBID=301, NAME="LTE-DEMO-A";
ADD ECELL: ENBID=301, ECELLID=1, EARFCN=1300, PCI=101, PWR=46, BAND=B3;

! ---------------------------------------------------------------------------
! Neighbor relations (multi-technology mobility)
! ---------------------------------------------------------------------------
ADD NR: SRC=LTE-301-1, DST=UMTS-201-1, MODE=AUTO;
ADD NR: SRC=LTE-301-1, DST=GSM-101-1, MODE=AUTO;

! ---------------------------------------------------------------------------
! Operational state
! ---------------------------------------------------------------------------
ACT CELL: BTSID=101, CELLID=1;
ACT UCELL: NODEBID=201, UCELLID=1;
ACT ECELL: ENBID=301, ECELLID=1;
LST CELLSTATE;
